          const prodData = {
            name: f.name.trim(),

            price: Number(f.price),

            updatedAt: new Date().toISOString()

        // Handle image file selection in browser
        function handleImageUpload(e) {
          const file = e.target.files && e.target.files[0];

          if (file.size > 5 * 1024 * 1024) {
            alert('حجم الصورة كبير، الحد الأقصى 5 ميجابايت');
            return;
          }
          const reader = new FileReader();
          reader.onload = function(evt) {
            state.productForm.image = evt.target.result;
            render();
          };
          reader.readAsDataURL(file);

                      return `
                        <div class="flex gap-3 bg-[#161b26] p-3 rounded-xl border border-slate-800">
                          <img src="${p.image}" class="w-16 h-16 rounded-lg object-cover bg-slate-800 shrink-0" />
                          <div class="flex flex-col flex-1 min-w-0">
                            <div class="flex items-start justify-between gap-1">
                              <h4 class="text-xs font-bold text-slate-200 line-clamp-1">${p.name}</h4>
                              <button onclick="removeCartItem('${p.id}')" class="text-slate-500 hover:text-rose-400 text-xs">🗑️</button>
                            </div>
                            <span class="text-[11px] text-[#e0a96d]">${p.categoryName || 'جهاز العروسة'}</span>
                            <div class="flex items-center justify-between mt-auto pt-2">
                              <div class="flex items-center gap-2 bg-[#10141d] rounded-lg p-0.5 border border-slate-700">
                                <button onclick="updateCartQty('${p.id}', -1)" class="px-2 py-0.5 text-slate-300 hover:text-white">-</button>
                                <span class="text-xs font-bold tabular-nums">${item.qty}</span>
                                <button onclick="updateCartQty('${p.id}', 1)" class="px-2 py-0.5 text-slate-300 hover:text-white">+</button>
                              </div>
                              <span class="text-xs font-bold text-[#f3d3b0] tabular-nums">${sub.toLocaleString('ar-EG')} ج.م</span>
                            </div>
                          </div>
                        </div>
                      `;
                    }).join('')}
                  </div>

                  ${state.cart.length > 0 ? `
                    <div class="p-4 border-t border-slate-800 bg-[#0c0f16] space-y-3">
                      <div class="flex items-center justify-between text-sm">
                        <span class="text-slate-400">إجمالي قيمة القائمة:</span>
                        <span class="text-lg font-bold text-[#e0a96d] tabular-nums">${total.toLocaleString('ar-EG')} ج.م</span>
                      </div>
                      <button type="button" onclick="requestCartOrder();" class="w-full inline-flex items-center justify-center gap-2 py-3 px-4 text-xs sm:text-sm font-bold text-[#0c0e14] bg-emerald-400 hover:bg-emerald-300 rounded-xl shadow-md cursor-pointer">
                        <span>💬 إرسال طلب القائمة عبر واتساب (01289778354)</span>
                      </button>
                      <p class="text-[10px] text-slate-500 text-center">الدفع نقداً عند الاستلام والمعاينة في سوهاج وجهينة</p>
                    </div>
                  ` : ''}
                </div>
              </div>
            </div>
          `;
        }

        function renderChecklistModal() {
          if (!state.isChecklistOpen) return '';
          const checkedCount = state.checklistChecked.length;
          const pct = Math.round((checkedCount / DEFAULT_CHECKLIST.length) * 100);

          return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-sm animate-fade-in text-right">
              <div class="relative w-full max-w-2xl bg-[#11151f] border border-slate-800 rounded-3xl p-4 sm:p-8 shadow-2xl max-h-[92vh] overflow-y-auto space-y-4 sm:space-y-5">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                  <div class="flex items-center gap-2">
                    <span class="text-2xl">📋</span>
                    <div>
                      <h3 class="text-sm sm:text-base font-bold text-white">قائمة ومساعد جهاز العروسة الذكي</h3>
                      <p class="text-[11px] sm:text-xs text-slate-400">دليلكِ المنظم لمستلزمات جهاز العروسة في سوهاج وجهينة</p>
                    </div>
                  </div>
                  <button onclick="state.isChecklistOpen = false; render();" class="p-2 text-slate-400 hover:text-white rounded-xl bg-slate-800/60 min-h-[44px] min-w-[44px] flex items-center justify-center text-base cursor-pointer">✕</button>
                </div>

                <!-- Progress -->
                <div class="bg-[#141824] p-4 rounded-2xl border border-slate-800 space-y-2">
                  <div class="flex items-center justify-between text-xs font-semibold">
                    <span class="text-slate-300">نسبة اكتمال تجهيز جهازك:</span>
                    <span class="text-[#e0a96d] font-mono">${checkedCount} من ${DEFAULT_CHECKLIST.length} بند (${pct}%)</span>
                  </div>
                  <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                    <div class="h-full bg-gradient-to-r from-amber-500 to-[#e0a96d] transition-all duration-300" style="width: ${pct}%"></div>
                  </div>
                </div>

                <!-- Items -->
                <div class="space-y-2">
                  ${DEFAULT_CHECKLIST.map(item => {
                    const isChecked = state.checklistChecked.includes(item.id);
                    return `
                      <div onclick="toggleChecklistItem('${item.id}')" class="flex items-center justify-between p-3 rounded-xl border cursor-pointer select-none transition-all ${isChecked ? 'bg-[#151d18] border-emerald-900/60 opacity-75' : 'bg-[#151923] border-slate-800 hover:border-slate-700'}">
                        <div class="flex items-center gap-3">
                          <span class="text-base">${isChecked ? '✅' : '⚪'}</span>
                          <div>
                            <span class="text-xs font-semibold ${isChecked ? 'line-through text-slate-400' : 'text-slate-200'}">${item.name}</span>
                            <span class="text-[10px] text-slate-500 block">${item.category} · المقترح: ${item.qty}</span>
                          </div>
                        </div>
                      </div>
                    `;
                  }).join('')}
                </div>
              </div>
            </div>
          `;
        }

        // 🔥 نافذة تسجيل دخول وحساب العميل مع التحقق من الاسم ورقم الهاتف للطلب 🔥
        function renderCustomerModal() {
          if (!state.isCustomerModalOpen) return '';

          const cust = state.customerUser;

          return `
            <div class="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-6 bg-black/85 backdrop-blur-sm animate-fade-in text-right">
              <div class="relative w-full max-w-md max-h-[92vh] overflow-y-auto bg-[#121622] border border-emerald-600/40 rounded-3xl p-5 sm:p-8 shadow-2xl space-y-4 sm:space-y-5">
                <button onclick="closeCustomerModal()" class="absolute top-4 left-4 p-2 rounded-xl text-slate-400 hover:text-white bg-slate-800/60 hover:bg-slate-700 min-h-[44px] min-w-[44px] flex items-center justify-center text-base cursor-pointer">✕</button>

                <div class="space-y-2">
                  <div class="w-12 h-12 rounded-2xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-2xl">
                    ${cust ? '👤' : '🌸'}
                  </div>
                  <h2 class="text-xl font-bold text-white">
                    ${cust ? 'بيانات حساب العميل' : 'تسجيل الدخول / تأكيد بيانات الطلب'}
                  </h2>
                  <p class="text-xs text-slate-400 leading-relaxed">
                    ${cust
                      ? 'أهلاً بكِ في روكا مول، يمكنكِ مراجعة بياناتكِ أو متابعة الطلب.'
                      : 'سجّلي اسمكِ ورقم هاتفكِ لتتمكني من إرسال طلب جهاز العروسة عبر واتساب وتأكيد التوصيل.'}
                  </p>
                </div>

                ${state.customerModalNotice ? `
                  <div class="p-3.5 rounded-2xl bg-amber-950/60 border border-amber-600/50 text-xs text-amber-200 leading-relaxed flex items-start gap-2">
                    <span class="text-base shrink-0">🔒</span>
                    <span>${state.customerModalNotice}</span>
                  </div>
                ` : ''}

                ${state.customerError ? `
                  <div class="p-3 rounded-xl bg-rose-950/80 border border-rose-800 text-xs text-rose-300">
                    ${state.customerError}
                  </div>
                ` : ''}

                ${cust ? `
                  <!-- Existing Logged In Customer View -->
                  <div class="space-y-3 bg-[#171d2b] p-4 rounded-2xl border border-slate-700/60 text-xs">
                    <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
                      <span class="text-slate-400">اسم العميل:</span>
                      <strong class="text-white">${cust.name}</strong>
                    </div>
                    <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
                      <span class="text-slate-400">رقم الموبايل:</span>
                      <strong class="text-emerald-400 font-mono" dir="ltr">${cust.phone}</strong>
                    </div>
                    <div class="flex items-center justify-between pb-2 border-b border-slate-700/60">
                      <span class="text-slate-400">المركز / العنوان:</span>
                      <strong class="text-slate-200">${cust.city || 'جهينة، سوهاج'}</strong>
                    </div>
                    <div class="flex items-center justify-between">
                      <span class="text-slate-400">عدد الطلبات المنفذة:</span>
                      <strong class="text-[#e0a96d] tabular-nums">${cust.ordersCount || 0} طلب</strong>
                    </div>
                  </div>

                  <div class="flex items-center gap-3 pt-2">
                    <button
                      type="button"
                      onclick="state.customerUser = null; render();"
                      class="flex-1 py-3 px-4 text-xs font-semibold text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl cursor-pointer"
                    >
                      تعديل البيانات
                    </button>
                    <button
                      type="button"
                      onclick="customerLogout()"
                      class="py-3 px-4 text-xs font-bold text-rose-300 bg-rose-950/50 hover:bg-rose-900/60 border border-rose-800/40 rounded-xl cursor-pointer"
                    >
                      تسجيل الخروج
                    </button>
                  </div>
                ` : `
                  <!-- Registration / Login Form -->
                  <form onsubmit="submitCustomerForm(event)" class="space-y-3.5 text-xs text-right">
                    <div class="space-y-1">
                      <label class="block font-bold text-slate-200">
                        الاسم بالكامل (أو اسم العروسة): <span class="text-rose-400">*</span>
                      </label>
                      <input
                        type="text"
                        value="${state.customerForm.name || ''}"
                        oninput="state.customerForm.name = this.value;"
                        placeholder="مثال: نورهان أحمد أو مريم سامي"
                        class="w-full px-3.5 py-2.5 bg-[#171d2b] border border-slate-700 focus:border-emerald-400 rounded-xl text-slate-100 placeholder:text-slate-500 focus:outline-none"
                        required
                        autofocus
                      />
                    </div>

                    <div class="space-y-1">
                      <label class="block font-bold text-slate-200">
                        رقم الموبايل / واتساب (11 رقم): <span class="text-rose-400">*</span>
                      </label>
                      <input
                        type="tel"
                        value="${state.customerForm.phone || ''}"
                        oninput="state.customerForm.phone = this.value;"
                        placeholder="012XXXXXXXX أو 010XXXXXXXX"
                        class="w-full px-3.5 py-2.5 bg-[#171d2b] border border-slate-700 focus:border-emerald-400 rounded-xl text-slate-100 placeholder:text-slate-500 focus:outline-none font-mono text-left"
                        dir="ltr"
                        required
                      />
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div class="space-y-1">
                        <label class="block font-bold text-slate-200">المركز (سوهاج):</label>
                        <select
                          onchange="state.customerForm.city = this.value;"
                          class="w-full px-3 py-2.5 bg-[#171d2b] border border-slate-700 rounded-xl text-slate-100 focus:outline-none"
                        >
                          <option value="مركز جهينة" ${state.customerForm.city === 'مركز جهينة' ? 'selected' : ''}>مركز جهينة</option>
                          <option value="مدينة سوهاج" ${state.customerForm.city === 'مدينة سوهاج' ? 'selected' : ''}>مدينة سوهاج</option>
                          <option value="مركز طهطا" ${state.customerForm.city === 'مركز طهطا' ? 'selected' : ''}>مركز طهطا</option>
                          <option value="مركز المراغة" ${state.customerForm.city === 'مركز المراغة' ? 'selected' : ''}>مركز المراغة</option>
                          <option value="مركز المنشأة" ${state.customerForm.city === 'مركز المنشأة' ? 'selected' : ''}>مركز المنشأة</option>
                          <option value="مركز جرجا" ${state.customerForm.city === 'مركز جرجا' ? 'selected' : ''}>مركز جرجا</option>
                          <option value="مركز أخميم" ${state.customerForm.city === 'مركز أخميم' ? 'selected' : ''}>مركز أخميم</option>
                          <option value="مركز البلينا" ${state.customerForm.city === 'مركز البلينا' ? 'selected' : ''}>مركز البلينا</option>
                          <option value="مركز آخر" ${state.customerForm.city === 'مركز آخر' ? 'selected' : ''}>مركز آخر بصعيد مصر</option>
                        </select>
                      </div>
                      <div class="space-y-1">
                        <label class="block font-bold text-slate-200">الشارع / القرية:</label>
                        <input
                          type="text"
                          value="${state.customerForm.address || ''}"
                          oninput="state.customerForm.address = this.value;"
                          placeholder="الشارع أو القرية..."
                          class="w-full px-3 py-2.5 bg-[#171d2b] border border-slate-700 rounded-xl text-slate-100 placeholder:text-slate-500 focus:outline-none"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      class="w-full py-3.5 px-4 text-xs sm:text-sm font-bold text-[#0c0e14] bg-emerald-400 hover:bg-emerald-300 rounded-xl shadow-md transition-all active:scale-[0.99] cursor-pointer mt-2"
                    >
                      تأكيد الدخول ومتابعة الطلب
                    </button>
                    <p class="text-[10px] text-slate-500 text-center">
                      🔒 بياناتكِ مسجلة بأمان وتظهر لإدارة المعرض لتجهيز طلبك وتحديد موعد المعاينة.
                    </p>
                  </form>
                `}
              </div>
            </div>
          `;
        }

        // --- 8. Mobile Bottom Navigation Bar ---
        function renderBottomNav() {
          const totalCartCount = state.cart.reduce((a, b) => a + b.qty, 0);
          return `
            <nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-[#0d1017]/95 backdrop-blur-xl border-t border-slate-800/90 shadow-2xl px-1 py-1.5 flex items-center justify-around text-center select-none" dir="rtl">
              <button onclick="setView('home')" class="flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer ${state.view === 'home' ? 'text-[#e0a96d] font-bold' : 'text-slate-400 hover:text-slate-200'}">
                <span class="text-base leading-none">🏠</span>
                <span class="text-[10px] leading-none">الرئيسية</span>
              </button>
              <button onclick="toggleMobileMenu()" class="flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer ${state.isMobileMenuOpen ? 'text-[#e0a96d] font-bold' : 'text-slate-400 hover:text-slate-200'}">
                <span class="text-base leading-none">📑</span>
                <span class="text-[10px] leading-none">الأقسام</span>
              </button>
              <button onclick="state.isChecklistOpen = true; render();" class="flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer text-slate-400 hover:text-slate-200">
                <span class="text-base leading-none">📋</span>
                <span class="text-[10px] leading-none">القائمة</span>
              </button>
              <button onclick="state.isCartOpen = true; render();" class="relative flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer text-slate-400 hover:text-slate-200">
                <span class="text-base leading-none">🛍️</span>
                <span class="text-[10px] leading-none">الجهاز</span>
                ${totalCartCount > 0 ? `<span class="absolute -top-0.5 right-2 w-4 h-4 bg-[#e0a96d] text-slate-950 text-[10px] font-bold rounded-full flex items-center justify-center leading-none">${totalCartCount}</span>` : ''}
              </button>
              <button onclick="openAdminModal()" class="flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer ${state.view === 'admin' ? 'text-amber-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                <span class="text-base leading-none">🛡️</span>
                <span class="text-[10px] leading-none">اللوحة</span>
              </button>
              <button onclick="openCustomerModal()" class="flex flex-col items-center justify-center gap-0.5 px-2 py-1 rounded-xl transition-colors min-h-[44px] min-w-[48px] cursor-pointer ${state.customerUser ? 'text-emerald-400 font-bold' : 'text-slate-400 hover:text-slate-200'}">
                <span class="text-base leading-none">👤</span>
                <span class="text-[10px] leading-none max-w-[46px] truncate">${state.customerUser ? state.customerUser.name.split(' ')[0] : 'حسابي'}</span>
              </button>
            </nav>
          `;
        }

        // --- 9. Core App Render Dispatcher ---
        function render() {
          window._standaloneAppMounted = true;
          const root = document.getElementById('root');
          if (!root) return;

          let content = '';
          if (state.view === 'home') content = renderHomePage();
          else if (state.view === 'category') content = renderCategoryPage();
          else if (state.view === 'product') content = renderProductPage();
          else if (state.view === 'search') content = renderSearchPage();
          else if (state.view === 'delivery') content = renderDeliveryPage();
          else if (state.view === 'about') content = renderAboutPage();
          else if (state.view === 'policy') content = renderPolicyPage();
          else if (state.view === 'admin') content = renderAdminDashboard();

          root.innerHTML = `
            <div class="min-h-screen flex flex-col w-full max-w-full overflow-x-hidden">
              ${state.view !== 'admin' ? renderHeader() : ''}
              <main class="flex-1 pb-20 md:pb-0">${content}</main>
              ${state.view !== 'admin' ? renderFooter() : ''}
              ${state.view !== 'admin' ? renderBottomNav() : ''}
              ${renderAdminPasswordModal()}
              ${renderCustomerModal()}
              ${renderAddEditProductModal()}
              ${renderCartDrawer()}
              ${renderChecklistModal()}
              ${state.toastMessage ? `
                <div class="fixed bottom-20 md:bottom-6 right-4 sm:right-6 z-50 bg-[#171d2b] border border-amber-600/40 text-amber-200 px-4 py-3 rounded-2xl shadow-2xl text-xs font-semibold animate-fade-in flex items-center gap-2 max-w-[90vw]">
                  <span>✨</span>
                  <span>${state.toastMessage}</span>
                </div>
              ` : ''}
            </div>
          `;
        }

        // Expose helper to trigger add product modal
        window.openAddProductModal = function() {
          window._isAddingProduct = true;
          state.editingProductId = null;
          state.productForm = {
            name: '',
            categoryId: state.categories[0]?.id || 'cat-homewear',
            price: '',
            oldPrice: '',
            image: '',
            description: '',
            features: '',
            badge: '',
            trousseauTip: '',
            isAvailable: true,
            isFeatured: false
          };
          render();
        };

        // Render on initial load
        window._standaloneAppMounted = true;
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', render);
        } else {
          render();
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
